<div class="report-filter">
  <mat-form-field appearance="outline" class="filter-field">
    <mat-label>Fecha desde</mat-label>
    <input matInput type="date" [ngModel]="dateFrom()" (ngModelChange)="dateFrom.set($event)" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="filter-field">
    <mat-label>Fecha hasta</mat-label>
    <input matInput type="date" [ngModel]="dateTo()" (ngModelChange)="dateTo.set($event)" />
  </mat-form-field>

  <button mat-raised-button color="primary" (click)="onApply()">
    <mat-icon>filter_list</mat-icon>
    Aplicar
  </button>

  <button mat-stroked-button (click)="onReset()">
    <mat-icon>refresh</mat-icon>
    Reiniciar
  </button>
</div>
